[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orbit-core"
dynamic = ["version"]
description = "A type-safe, service-oriented orchestration framework."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Orbit Contributors" }]
keywords = ["asgi", "cloud-native", "framework", "orchestration", "services"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "rich>=13.8,<16",
]

[project.scripts]
orbit = "orbit.cli:app"

[project.urls]
Source = "https://github.com/orbit-projects/orbit-core"
Issues = "https://github.com/orbit-projects/orbit-core/issues"
Documentation = "https://github.com/orbit-projects/orbit-core/tree/main/docs"
Security = "https://github.com/orbit-projects/orbit-core/security/policy"

[project.optional-dependencies]
development-server = ["uvicorn>=0.34,<1"]
process-plugins = ["grpcio>=1.84,<2", "protobuf>=7.35.1,<8"]
server = [
  "gunicorn>=26.2,<27",
  "uvicorn>=0.34,<1",
  "uvicorn-worker>=0.4,<1",
]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "mypy-protobuf>=3.7,<4",
  "types-grpcio>=1.0.0.20251009",
  "types-protobuf>=7.35.1,<8",
  "build>=1.2,<2",
  "hatchling>=1.27",
  "grpcio-tools>=1.84,<2",
  "pip-audit>=2.10,<3",
  "pip>=26.2,<27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]

[tool.hatch.build.targets.wheel.force-include]
"src/orbit/plugins/v1/process_plugin.proto" = "orbit/plugins/v1/process_plugin.proto"

[tool.hatch.build.targets.sdist.force-include]
"src/orbit/plugins/v1/process_plugin.proto" = "src/orbit/plugins/v1/process_plugin.proto"

[tool.hatch.version]
path = "src/orbit/_version.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["hosting: real Gunicorn/Uvicorn worker-process validation"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "src/orbit/plugins/v1/process_plugin_pb2.py",
  "src/orbit/plugins/v1/process_plugin_pb2.pyi",
  "src/orbit/plugins/v1/process_plugin_pb2_grpc.py",
  "src/orbit/plugins/v1/process_plugin_pb2_grpc.pyi",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["orbit"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orbit"]

[tool.coverage.run]
branch = true
source = ["orbit"]

[tool.coverage.report]
fail_under = 90
show_missing = true
