name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: orbit-core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orbit_core
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: orbit_core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: orbit-projects/orbit-testing
          ref: main
          path: orbit-testing
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.13
      - run: uv sync --frozen --extra dev --extra server --python '${{ matrix.python-version }}'
      - run: uv lock --check
      - run: uv run --no-sync ruff check src tests scripts examples
      - run: uv run --no-sync ruff format --check src tests scripts examples
      - run: uv run --no-sync mypy src/orbit
      - run: uv run --no-sync python scripts/check-workflows.py
      - run: uv run --no-sync python scripts/check-scorecard.py
      - run: uv run --no-sync python scripts/check-model-boundaries.py
      - run: uv run --no-sync pytest --cov=orbit --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: orbit_core/coverage.xml
          if-no-files-found: error
          retention-days: 14
      - run: uv run --no-sync python scripts/check-documentation.py
      - name: Validate managed Gunicorn/Uvicorn workers
        run: ORBIT_RUN_HOSTING_TESTS=1 uv run --no-sync pytest -q tests/integration/test_gunicorn_host.py
      - run: uv run --no-sync python scripts/check-license-headers.py
      - run: uv run --no-sync python -m build --no-isolation
      - run: uv run --no-sync python scripts/check-package.py dist
      - run: uv run --no-sync pip-audit --skip-editable --progress-spinner off
