name: Build release artifact
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbit-core-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orbit_core
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: orbit_core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: orbit-projects/orbit-testing
          ref: main
          path: orbit-testing
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.13
      - run: uv sync --frozen --extra dev --extra server
      - run: uv lock --check
      - run: uv run --no-sync ruff check src tests scripts examples
      - run: uv run --no-sync ruff format --check src tests scripts examples
      - run: uv run --no-sync mypy src/orbit
      - run: uv run --no-sync python scripts/check-workflows.py
      - run: uv run --no-sync python scripts/check-scorecard.py
      - run: uv run --no-sync python scripts/check-model-boundaries.py
      - run: uv run --no-sync pytest --cov=orbit
      - name: Validate managed Gunicorn/Uvicorn workers
        run: ORBIT_RUN_HOSTING_TESTS=1 uv run --no-sync pytest -q tests/integration/test_gunicorn_host.py
      - run: uv run --no-sync python scripts/check-documentation.py
      - run: uv run --no-sync python scripts/check-license-headers.py
      - run: uv run --no-sync pip-audit --skip-editable --progress-spinner off
      - run: uv run --no-sync python -m build --no-isolation
      - run: uv run --no-sync python scripts/check-package.py dist
      - run: uv run --no-sync pip-audit --skip-editable --format cyclonedx-json --output dist/dependencies.cdx.json
      - name: Validate dependency SBOM syntax
        run: python -m json.tool dist/dependencies.cdx.json > /dev/null
      - name: Generate release checksums
        run: |
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 --no-run-if-empty sha256sum > dist/SHA256SUMS
      - name: Verify release checksums
        run: sha256sum --check dist/SHA256SUMS
      - run: uv run --no-sync python scripts/check-release.py dist
      - uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: dist/*
          upload-signing-artifacts: true
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: orbit_core/dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbit-core-distributions
          path: orbit_core/dist/
          if-no-files-found: error
