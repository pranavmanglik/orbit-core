[tox]
env_list = py311, py312, py313, py314, lint, type
isolated_build = true

[testenv]
package = editable
extras = dev, server, process-plugins
set_env = COVERAGE_FILE={env_tmp_dir}/.coverage
commands = pytest --cov=orbit --cov-report=term-missing {posargs}

[testenv:lint]
extras = dev
commands =
    ruff check src tests scripts examples
    ruff format --check src tests scripts examples
    python scripts/check-workflows.py
    python scripts/check-scorecard.py
    python scripts/check-model-boundaries.py
    python scripts/check-documentation.py
    python scripts/check-license-headers.py

[testenv:type]
extras = dev
commands = mypy src/orbit
